
name: Daily PMS Health Check

on:
  schedule:
    # Every day at 9:00 AM IST (03:30 UTC)
    - cron: "30 3 * * *"

  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Render API
        run: |
          echo "Checking Render API..."

          STATUS=$(curl -L -s -o response.txt \
            -w "%{http_code}" \
            --max-time 120 \
            "$RENDER_HEALTH_URL")

          cat response.txt

          if [ "$STATUS" -ne 200 ]; then
            echo "Render API health check failed: $STATUS"
            exit 1
          fi

          echo "Render API is healthy!"
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check Supabase Database
        run: |
          echo "Checking Supabase PostgreSQL..."

          psql "$SUPABASE_DB_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 1;"

          echo "Supabase database is reachable!"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
